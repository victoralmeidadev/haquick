version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      radix:
        patterns: ['@radix-ui/*']
      dev:
        dependency-type: development
    ignore:
      # O ecossistema React Native segue a versão do Expo SDK e é atualizado
      # com `npx expo install --fix`, nunca isoladamente.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native*'
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@gorhom/*'
      - dependency-name: '@storybook/react-native*'
      - dependency-name: '@storybook/addon-ondevice-*'
      # Majors destes exigem migração manual; o patch e o minor continuam vindo.
      - dependency-name: '@storybook/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'storybook'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
